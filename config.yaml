# Smart Warehouse RL - central defaults. Every trainer/evaluator reads its own
# section; CLI flags override. Keys here mirror the dataclasses in code
# (EnvConfig, RewardConfig, ...). Unknown keys must raise, not be ignored.
env:
  grid_h: 10
  grid_w: 10
  max_steps: 200
  battery_enabled: true
  battery_capacity: 60
  battery_init_range: [0.5, 1.0]   # initial charge ~ U(lo, hi) * capacity
  recharge_amount: 20              # battery gained per (valid) Recharge action
  n_chargers: 2
  n_pickup_stations: 3             # candidate pickup cells per layout
  n_delivery_stations: 3           # candidate delivery cells per layout
  view_radius: 2                   # egocentric local obstacle window (2r+1)^2
  layout_seeds: null               # null => new random layout every reset
reward:
  preset: default                  # default|sparse|shaped|high_move_penalty|low_collision_penalty|no_pickup_bonus
splits:
  train_layout_seeds: [0, 1, 2, 3, 4]
  test_layout_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
                      1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019]
  train_seed_base: 0               # training episode seeds start here
  eval_seed_base: 100000           # evaluation episode seeds start here (disjoint)
qlearning:
  episodes: 100000
  alpha: 0.2
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_episodes: 60000
  battery_buckets: 6
dqn:
  episodes: 3000
  gamma: 0.99
  lr: 0.001
  batch_size: 64
  buffer_size: 100000
  learning_starts: 1000
  target_update_every: 500         # gradient steps (hard update) ; tau below if soft
  tau: null
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 60000
  hidden: [128, 128]
  double_dqn: false
  use_action_mask: true            # masked DQN was the only stable variant on random layouts
  grad_clip: 10.0
ppo:
  total_timesteps: 600000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  net_arch: [128, 128]
